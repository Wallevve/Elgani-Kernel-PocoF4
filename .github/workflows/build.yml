name: Build Elgani Kernel - POCO F4

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target_os:
        description: "Target kernel variant"
        required: true
        type: choice
        default: "aosp"
        options: [aosp, miui, both]
      ksu:
        description: "Enable official KernelSU"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  KERNEL_REPO: AstideLabs/android_kernel_xiaomi_sm8250
  KERNEL_REF: android17-aptusitu
  MUNCH_DT_REPO: xiaomi-sm8250-devs/android_device_xiaomi_munch
  MUNCH_DT_REF: lineage-23.2
  DEVICE: munch

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Elgani build repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex gawk git gnupg gperf imagemagick libncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache_mikernel
          key: ${{ runner.os }}-munch-kernel-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-munch-kernel-

      - name: Clone AstideLabs kernel
        run: |
          git clone --depth=1 --branch "$KERNEL_REF" "https://github.com/$KERNEL_REPO.git" kernel
          cd kernel
          git log -1 --oneline
          test -f arch/arm64/configs/munch_defconfig
          test -f arch/arm64/configs/munch_stock-defconfig

          echo "[*] Rebranding source tree APTKernel -> ElganiKernel..."
          grep -RIl "APTKernel" . --exclude-dir=.git | xargs -r sed -i 's/APTKernel/ElganiKernel/g'
          if grep -RIn "APTKernel" . --exclude-dir=.git; then
            echo "[!] APTKernel reference still exists after rebranding."
            exit 1
          fi
          echo "[+] Source branding verified: ElganiKernel"

      - name: Apply POCO F4 bypass charging
        run: |
          echo "[*] Applying Munch bypass charging directly to the current source..."
          python3 scripts/apply_munch_bypass.py
          grep -n "BYPASS_VOTER" kernel/drivers/power/supply/qcom/smb5-lib-munch.h
          grep -n "bypass_charging" kernel/drivers/power/supply/qcom/smb5-lib-munch.c
          echo "[+] Bypass charging source modifications applied"

      - name: Clone POCO F4 device tree reference
        run: |
          git clone --depth=1 --branch "$MUNCH_DT_REF" "https://github.com/$MUNCH_DT_REPO.git" device_xiaomi_munch
          cd device_xiaomi_munch
          git log -1 --oneline

      - name: Setup ZyCromerZ Clang 16
        run: |
          mkdir -p "$HOME/zyc-clang"
          cd "$HOME/zyc-clang"
          wget -q "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz"
          tar -xzf Clang-16.0.6-20260807.tar.gz

      - name: Prepare official KernelSU build integration
        working-directory: kernel
        run: |
          echo "[*] Converting AstideLabs KSU integration from ReSukiSU to official KernelSU..."
          python3 - <<'PY'
          from pathlib import Path

          p = Path("build_kernel.sh")
          s = p.read_text()

          old = 'curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash'
          new = 'curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash'
          if old not in s:
              raise SystemExit("Expected ReSukiSU setup command not found")
          s = s.replace(old, new)

          s = s.replace(
              'echo " [*] Initializing KernelSU (ReSukiSU) Setup"',
              'echo " [*] Initializing official KernelSU Setup"'
          )
          s = s.replace(
              'echo "[*] Downloading and running ReSukiSU remote setup script..."',
              'echo "[*] Downloading and running official KernelSU remote setup script..."'
          )

          old_cfg = '''        scripts/config --file "${OUT_DIR}/.config" \
            -e KSU \
            -e THREAD_INFO_IN_TASK \
            -e KSU_SUSFS'''
          new_cfg = '''        scripts/config --file "${OUT_DIR}/.config" \
            -e KSU \
            -e THREAD_INFO_IN_TASK'''
          if old_cfg not in s:
              raise SystemExit("Expected ReSukiSU/SuSFS config block not found")
          s = s.replace(old_cfg, new_cfg)

          s = s.replace('KSU_ZIP_STR="ReSukiSU-SuSFS"', 'KSU_ZIP_STR="KernelSU"')
          p.write_text(s)
          PY

          grep -n "KernelSU" build_kernel.sh
          if grep -n "ReSukiSU\|KSU_SUSFS" build_kernel.sh; then
            echo "[!] ReSukiSU/SuSFS references remain in build script."
            exit 1
          fi
          echo "[+] Official KernelSU integration verified"

      - name: Build kernel
        working-directory: kernel
        env:
          TARGET_OS: ${{ github.event.inputs.target_os || 'aosp' }}
          ENABLE_KSU: ${{ github.event_name == 'push' && 'true' || github.event.inputs.ksu || 'true' }}
        run: |
          chmod +x build_kernel.sh
          args="munch"
          if [ "$ENABLE_KSU" = "true" ]; then args="$args ksu"; fi
          if [ "$TARGET_OS" != "both" ]; then args="$args $TARGET_OS"; fi
          ./build_kernel.sh $args

      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Elgani-Kernel-PocoF4-${{ github.run_number }}
          path: |
            kernel/ElganiKernel_*.zip
            kernel/out_*/arch/arm64/boot/Image
            kernel/out_*/arch/arm64/boot/dtb
          if-no-files-found: error
          compression-level: 0

      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" \
            kernel/ElganiKernel_*.zip \
            --title "Elgani Kernel POCO F4 $RELEASE_TAG" \
            --generate-notes \
            --target "$GITHUB_SHA"
